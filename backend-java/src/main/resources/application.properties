server.port=${SERVER_PORT:8080}
spring.application.name=backend-java

# MongoDB Connection (Reads from ENV / system environment)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/emotion_db}

# FastAPI AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Google AI Studio Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}

# Reduce MongoDB driver logging spam
logging.level.org.mongodb.driver=WARN

# Multipart File Upload limits (support video upload up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
